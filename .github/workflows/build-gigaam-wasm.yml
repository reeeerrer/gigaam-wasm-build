name: Сборка GigaAM для браузера

on:
  workflow_dispatch:
    inputs:
      sherpa_version:
        # НЕ поднимать выше v1.13.0! С v1.13.2 wasm собирается многопоточным
        # и требует заголовков COOP/COEP — на обычном хостинге молча виснет.
        description: 'Версия sherpa-onnx. v1.13.0 — последняя однопоточная.'
        required: true
        default: 'v1.13.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Скачать исходники sherpa-onnx
        uses: actions/checkout@v4
        with:
          repository: k2-fsa/sherpa-onnx
          ref: ${{ inputs.sherpa_version }}

      - name: Поставить Emscripten 4.0.23
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.23
          actions-cache-folder: 'emsdk-cache'

      - name: Показать версию компилятора
        run: emcc -v

      - name: Скачать модель GigaAM-v3 (CTC) и VAD
        run: |
          set -ex
          cd wasm/vad-asr/assets
          BASE=https://huggingface.co/csukuangfj/sherpa-onnx-nemo-ctc-giga-am-v3-russian-2025-12-16/resolve/main
          curl -fSL -o nemo-ctc.onnx "$BASE/model.int8.onnx"
          curl -fSL -o tokens.txt    "$BASE/tokens.txt"
          curl -fSL -o silero_vad.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          ls -lh

      # По умолчанию sherpa-onnx собирает модуль МНОГОПОТОЧНЫМ. Такому нужны
      # заголовки COOP/COEP от сервера, а без них он молча виснет после загрузки
      # модели. На обычном хостинге их нет — собираем в один поток.
      - name: Убрать многопоточность
        run: |
          set -ex
          sed -i 's/ -pthread -sPTHREAD_POOL_SIZE=4 //' wasm/vad-asr/CMakeLists.txt
          grep -n "MY_FLAGS" wasm/vad-asr/CMakeLists.txt
          if grep -q "pthread" wasm/vad-asr/CMakeLists.txt; then
            echo "НЕ УДАЛОСЬ убрать -pthread — сборка была бы нерабочей"; exit 1
          fi

      - name: Собрать WebAssembly
        run: |
          set -ex
          ./build-wasm-simd-vad-asr.sh

      - name: Проверить, что сборка однопоточная
        run: |
          cd build-wasm-simd-vad-asr/install/bin/wasm/vad-asr
          cat > check.cjs <<'EOF'
          const Orig = WebAssembly.Memory;
          WebAssembly.Memory = function (d) {
            if (d && d.shared) { console.error('ПРОВАЛ: модуль просит разделяемую память (многопоточная сборка)'); process.exit(1); }
            console.log('OK: однопоточная сборка, память', JSON.stringify(d)); process.exit(0);
          };
          global.Module = { printErr(){}, onAbort(){} };
          require('./sherpa-onnx-wasm-main-vad-asr.js');
          setTimeout(() => { console.error('ПРОВАЛ: память так и не создалась'); process.exit(1); }, 60000);
          EOF
          node check.cjs
          rm -f check.cjs

      - name: Показать, что получилось
        run: ls -lh build-wasm-simd-vad-asr/install/bin/wasm/vad-asr

      - name: Выложить результат
        uses: actions/upload-artifact@v4
        with:
          name: gigaam-wasm
          path: build-wasm-simd-vad-asr/install/bin/wasm/vad-asr
          retention-days: 1
